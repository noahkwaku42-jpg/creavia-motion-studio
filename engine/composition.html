<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CreaviaAI demo composition</title>
<!-- Starter composition: a 15 s SaaS explainer (hook, problem, solution, features, logo).
     Copy this folder per film, then replace the tokens, copy and scenes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>
  :root {
    /* Film palette: charcoal + apple green (CreaviaAI house look) */
    --bg: #16181b; --bg-2: #1e2125; --surface: #24282d; --surface-2: #2c3137; --surface-3: #3a4048;
    --ink: #f3f5f2; --ink-2: #a9b0aa; --accent: #8db600; --accent-2: #b5e61d; --on-accent: #10140a;
    --font-display: 'Space Grotesk', Inter, system-ui, sans-serif;
  }
  .bg-grid { position: absolute; inset: -10%; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: calc(var(--u) * 8) calc(var(--u) * 8); }
  .prompt-label { font-size: calc(var(--u) * 2.1); color: var(--ink-2); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: calc(var(--u) * 1.4); display: flex; align-items: center; gap: calc(var(--u) * .8); }
  .prompt-box { font-size: calc(var(--u) * 3.6); line-height: 1.35; min-height: 2.8em; color: var(--ink); font-weight: 500; }
  .prompt-row { display: flex; justify-content: space-between; align-items: center; margin-top: calc(var(--u) * 2.2); gap: calc(var(--u) * 1); }
  .chips { display: flex; gap: calc(var(--u) * .8); }
  .chip { font-size: calc(var(--u) * 1.9); color: var(--ink-2); border: 1px solid var(--surface-3); border-radius: 99px; padding: calc(var(--u) * .4) calc(var(--u) * 1.2); }
  .gen-btn { position: relative; overflow: hidden; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: calc(var(--u) * 2.7); border-radius: 99px; padding: calc(var(--u) * 1.3) calc(var(--u) * 3); display: flex; gap: calc(var(--u) * .6); align-items: center; }
  .progress { height: calc(var(--u) * .8); border-radius: 99px; background: var(--surface-3); margin-top: calc(var(--u) * 2); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }
  .feat { display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 2.6); }
  .feat-ic { width: calc(var(--u) * 7.5); height: calc(var(--u) * 7.5); border-radius: calc(var(--u) * 1.6); background: rgba(141,182,0,.14); display: grid; place-items: center; }
  .feat-big { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--u) * 5.8); letter-spacing: -.03em; line-height: 1; }
  .feat-sm { color: var(--ink-2); font-size: calc(var(--u) * 2.4); }
  .toast { font-size: calc(var(--u) * 2.3); padding: calc(var(--u) * 1.5) calc(var(--u) * 2.2); }
  .toast-ic { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); }
  .url { font-size: calc(var(--u) * 2.2); }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script src="engine.js"></script>
<script>
const S = STUDIO, { pick, set, place, el, spring, tween, prog, clamp, wobble } = S;
S.duration = 15;
S.bpm = 120;
S.music = { mood: 'tech', bpm: 120, gain: 0.5 };

// ---------- persistent background ----------
S.layer({ id: 'bg', build(root) {
  root.style.background = 'radial-gradient(120% 90% at 50% 0%, #1f2327 0%, #16181b 60%, #121416 100%)';
  const grid = el('div', { cls: 'bg-grid' }, root);
  const b1 = place(S.blob(root, { size: 70, color: 'rgba(141,182,0,.55)', o: .35 }), .2, .25);
  const b2 = place(S.blob(root, { size: 55, color: 'rgba(181,230,29,.45)', o: .22 }), .85, .8);
  return { grid, b1, b2 };
}, draw(T, r) {
  set(r.b1, { x: wobble(T, 1, 8, .5), y: wobble(T, 2, 6, .4) });
  set(r.b2, { x: wobble(T, 3, 9, .45), y: wobble(T, 4, 7, .5) });
  r.grid.style.transform = `translateY(${-(T * .6) % 8 * S.u}px)`;
} });

// ---------- 1. Hook: kinetic headline ----------
S.scene({ id: 'hook', start: 0, end: 2.7, build(root, sc) {
  const k = S.text(root, 'Ideas deserve\n*motion.*', { size: pick({ wide: 12, tall: 13, square: 12 }), weight: 700 });
  place(k.el, .5, .5);
  const line = place(el('div', { style: { height: S.px(.7), width: S.px(pick({ wide: 46, tall: 60, square: 50 })), background: 'var(--accent)', borderRadius: '99px' } }, root), .5, .5);
  S.cue(.05, 'whoosh', .7); S.cue(.25, 'pop', .6); S.cue(.55, 'pop', .7); S.cue(1.0, 'shimmer', .5); S.cue(2.2, 'swoosh', .8);
  return { k, line };
}, draw(t, r, sc) {
  r.k.draw(t, { at: .15, stagger: .12, mode: 'rise', outAt: 2.2, outMode: 'rise' });
  set(r.k.el, { s: 1 + t * .012 });
  const lp = S.ease.outExpo(prog(t, .9, 1.5)) - S.ease.inExpo(prog(t, 2.15, 2.5));
  set(r.line, { y: pick({ wide: 15, tall: 17, square: 15 }), sx: Math.max(0, lp), o: lp > 0 ? 1 : 0 });
} });

// ---------- 2. Problem: production chaos, then pulled to centre ----------
const TOASTS = [
  { icon: 'alert', title: 'Render failed', body: 'frame 812 of 900', icBg: '#ff6159', icColor: '#fff' },
  { icon: 'mail', title: 'Client', body: 'one more small change…' },
  { icon: 'film', title: 'Storyboard_v7_FINAL2', body: 'edited 2 min ago', icBg: '#3a4048', icColor: '#fff' },
  { icon: 'chat', title: 'Brief', body: '"just make it pop"' },
  { icon: 'bell', title: 'Deadline', body: 'tomorrow, 9:00', icBg: '#ffbd2e' },
  { icon: 'x', title: 'Export', body: 'codec not supported', icBg: '#ff6159', icColor: '#fff' },
];
const SPOTS = {
  wide: [[-56, -26, -6], [52, -28, 5], [-34, 22, 4], [50, 24, -4], [-62, 36, 3], [4, -38, -2]],
  tall: [[-14, -52, -6], [16, -30, 5], [-16, 22, 4], [14, 44, -4], [-12, 64, 3], [12, -72, -2]],
  square: [[-28, -30, -6], [26, -18, 5], [-30, 14, 4], [28, 28, -4], [-6, 40, 3], [8, -40, -2]],
};
S.scene({ id: 'problem', start: 2.4, end: 5.7, build(root, sc) {
  const head = S.text(root, 'Briefs. Revisions.\n*Render hell.*', { size: pick({ wide: 6.5, tall: 8, square: 7 }), accent: '#ff7a6b' });
  place(head.el, .5, pick({ wide: .5, tall: .5, square: .5 }));
  const toasts = TOASTS.map((d) => place(S.toast(root, d), .5, .5));
  toasts.forEach((_, i) => S.cue(sc.start + .15 + i * .11, 'pop', .55));
  S.cue(sc.start + 2.3, 'swoosh', .9); S.cue(sc.start + 2.85, 'impact', .6);
  return { head, toasts };
}, draw(t, r) {
  const spots = pick(SPOTS);
  r.head.draw(t, { at: .35, stagger: .1, mode: 'blur', outAt: 2.3, outMode: 'blur' });
  const pull = spring(t - 2.3, 'heavy');
  r.toasts.forEach((e, i) => {
    const [x, y, rot] = spots[i];
    const p = spring(t - .15 - i * .11, 'playful');
    const jx = wobble(t, i, 1.2, 1.6), jy = wobble(t, i + 9, 1, 1.4);
    set(e, { x: (x + jx) * (1 - pull), y: (y + jy + (1 - p) * 14) * (1 - pull), r: rot * (1 - pull) + (1 - p) * 10, s: (.6 + .4 * p) * (1 - pull * .92), o: clamp(p * 1.4) * (1 - prog(t, 2.6, 2.9)) });
  });
} });

// ---------- 3. Solution: type the idea, click Generate ----------
const IDEA = 'A 30s explainer for my coffee app · 9:16 · apple green';
S.scene({ id: 'solution', start: 5.5, end: 9.7, build(root, sc) {
  const card = place(S.card(root, { w: pick({ wide: 84, tall: 90, square: 86 }), pad: 3.6 }), .5, .5);
  card.body.innerHTML = `<div class="prompt-label">${S.icon('spark', { size: 2, color: 'var(--accent)' })} Your idea</div>
    <div class="prompt-box"></div>
    <div class="prompt-row"><div class="chips"><span class="chip">Explainer</span><span class="chip">9:16</span><span class="chip">30s</span></div>
    <div class="gen-btn">${S.icon('bolt', { size: 2.2, color: 'var(--on-accent)' })}<span>Generate</span></div></div>
    <div class="progress"><i></i></div>`;
  const box = card.querySelector('.prompt-box'), btn = card.querySelector('.gen-btn'), bar = card.querySelector('.progress i'), prog_ = card.querySelector('.progress');
  const cur = place(S.cursor(root), .5, .5);
  const bx = pick({ wide: 31, tall: 31, square: 30 }), by = pick({ wide: 7, tall: 9, square: 7.5 });
  cur.plan(sc.start, { x: bx + 30, y: by + 40 }, [{ at: 1.6, x: bx, y: by }], [2.35]);
  S.typeCues(sc.start + .5, IDEA, 36, 3);
  S.cue(sc.start + .2, 'whoosh', .5); S.cue(sc.start + 3.3, 'ding', .7); S.cue(sc.start + 3.75, 'whoosh', .9);
  return { card, box, btn, bar, prog_, cur };
}, draw(t, r) {
  const inP = spring(t, 'default');
  const zoom = S.ease.inExpo(prog(t, 3.7, 4.2));
  set(r.card, { y: (1 - inP) * 18, s: (.92 + .08 * inP) * (1 + zoom * 3), o: clamp(t * 4) * (1 - zoom), rx: (1 - inP) * 12, persp: 120 });
  S.typeOn(r.box, IDEA, t, .5, 36);
  const press = t > 2.35 && t < 2.55 ? .94 : 1;
  r.btn.style.transform = `scale(${press})`;
  r.btn.style.boxShadow = t > 2.35 ? `0 0 0 ${S.px(clamp((t - 2.35) * 2) * 1.4)} rgba(141,182,0,${.35 * (1 - clamp((t - 2.35) * 1.5))})` : 'none';
  r.prog_.style.opacity = t > 2.45 ? 1 : 0;
  r.bar.style.width = S.ease.inOutCubic(prog(t, 2.5, 3.3)) * 100 + '%';
  r.cur.draw(t, { o: 1 - prog(t, 2.9, 3.2) });
} });

// ---------- 4. Features: three cards, counter ----------
const FEATS = [
  { icon: 'film', big: 29, label: 'pro motion styles', count: true },
  { icon: 'ratio', big: '16:9 · 9:16', label: 'any aspect ratio' },
  { icon: 'palette', big: 'Your brand', label: 'your colours, your fonts' },
];
S.scene({ id: 'features', start: 9.5, end: 12.7, build(root, sc) {
  const title = S.text(root, 'Directed, not *generated.*', { size: pick({ wide: 5.2, tall: 6, square: 5.6 }) });
  place(title.el, .5, pick({ wide: .2, tall: .17, square: .17 }));
  const cards = FEATS.map((f) => {
    const c = place(S.card(root, { w: pick({ wide: 46, tall: 80, square: 62 }) }), .5, .5);
    c.body.className = 'feat';
    c.body.innerHTML = `<div class="feat-ic">${S.icon(f.icon, { size: 3.4, color: 'var(--accent)' })}</div><div class="feat-big">${f.count ? '0' : f.big}</div><div class="feat-sm">${f.label}</div>`;
    c.big = c.querySelector('.feat-big');
    return c;
  });
  cards.forEach((_, i) => S.cue(sc.start + .3 + i * .18, 'pop', .7));
  S.cue(sc.start + 2.75, 'swoosh', .7);
  return { title, cards };
}, draw(t, r) {
  r.title.draw(t, { at: .05, stagger: .07, mode: 'rise', outAt: 2.8 });
  const pos = pick({ wide: [[-50, 10], [0, 10], [50, 10]], tall: [[0, -26], [0, 10], [0, 46]], square: [[0, -17], [0, 10], [0, 37]] });
  const out = S.ease.inCubic(prog(t, 2.75, 3.15));
  r.cards.forEach((c, i) => {
    const p = spring(t - .3 - i * .18, 'default');
    set(c, { x: pos[i][0], y: pos[i][1] + (1 - p) * 22 + wobble(t, i, .5, 1) - out * 6, s: .9 + .1 * p, o: clamp(p * 1.6) * (1 - out), r: (1 - p) * (i - 1) * 4 });
    if (FEATS[i].count) c.big.textContent = S.count(t, .5, 1.4, 0, 29);
  });
} });

// ---------- 5. Logo lockup + CTA ----------
S.scene({ id: 'logo', start: 12.5, end: 15, build(root, sc) {
  const ring = place(el('div', { style: { width: S.px(30), height: S.px(30), borderRadius: '50%', border: `${S.px(.5)} solid var(--accent)` } }, root), .5, .5);
  const logo = place(S.logo(root, { text: 'Creavia<span style="color:var(--accent)">AI</span>', size: pick({ wide: 10, tall: 11, square: 10 }) }), .5, .5);
  const tag = S.text(root, 'Motion design, directed by Claude.', { size: pick({ wide: 2.8, tall: 3.4, square: 3 }), weight: 500, color: 'var(--ink-2)', font: 'var(--font-body)', ls: '0' });
  place(tag.el, .5, .5);
  const url = place(S.pill(root, 'creavia.ai', { icon: 'arrow', bg: 'var(--accent)', color: 'var(--on-accent)', size: 2.2, iconColor: 'var(--on-accent)' }), .5, .5);
  S.cue(sc.start + .15, 'impact', .9); S.cue(sc.start + .7, 'shimmer', .6); S.cue(sc.start + 1.1, 'pop', .6);
  return { ring, logo, tag, url };
}, draw(t, r) {
  const p = spring(t - .1, 'heavy');
  const rp = S.ease.outExpo(prog(t, .1, 1.2));
  set(r.ring, { s: .2 + rp * 2.2, o: (1 - rp) * .8 });
  set(r.logo, { y: -4, s: .7 + .3 * p, o: clamp(p * 2), blur: (1 - p) * 1.2 });
  r.tag.draw(t, { at: .6, stagger: .05, mode: 'rise' });
  set(r.tag.el, { y: pick({ wide: 7, tall: 8, square: 7.5 }) });
  const up = spring(t - 1.1, 'snappy');
  set(r.url, { y: pick({ wide: 15, tall: 17, square: 16 }) + (1 - up) * 6, s: .8 + .2 * up, o: clamp(up * 2) });
} });

S.grain(.05);
S.vignette(.4);
S.start();
</script>
</body>
</html>
